name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

# A new push to a pull request cancels that PR's older run. Pushes to main each get their
# own group (the run id), so every main commit keeps its own result: a shared group would
# cancel the in-progress run, or replace a pending one even with cancel-in-progress off.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# The toolchain is installed from mise.lock: with that file in the repo, mise-action runs
# `mise install --locked`, which checks each download against the SHA-256 recorded there
# and refuses a tool that has no entry.
# Each job caches its own deps and _build (key starts with the job id): the jobs build
# different envs, and a shared key would keep only the first job's _build.
# The deps, _build and PLT keys also carry the hash of mise.lock, so they are rebuilt when
# any tool's download changes. The version alone is not enough: Dialyzer refuses a PLT
# made by another build of the same OTP version ("Old PLT file").

jobs:
  advisories:
    name: Ubuntu (dependency advisories)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.11.7
          install_args: osv-scanner

      - name: Known advisories in mix.lock and pnpm-lock.yaml
        run: osv-scanner scan source --lockfile mix.lock --lockfile assets/pnpm-lock.yaml

  ubuntu:
    name: Ubuntu (all gates)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history for gitleaks.
          fetch-depth: 0

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.11.7

      - name: Secret scan
        run: gitleaks git --redact --no-banner --verbose

      - name: Read toolchain versions
        id: versions
        run: |
          otp=$(erl -noshell -eval '{ok, V} = file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])), io:put_chars(string:trim(V)), halt().')
          elixir=$(elixir -e 'IO.write(System.version())')
          echo "image=${ImageOS:?}" >> "$GITHUB_OUTPUT"
          echo "key=${ImageOS:?}-${{ runner.arch }}-otp-${otp}-elixir-${elixir}-${{ hashFiles('mise.lock') }}" >> "$GITHUB_OUTPUT"

      - name: Cache deps and _build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ github.job }}-${{ steps.versions.outputs.key }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ github.job }}-${{ steps.versions.outputs.key }}-

      - name: Install Hex and rebar3
        run: |
          mix local.hex 2.6.0 --force
          mix local.rebar --force

      - name: Fetch deps
        run: mix deps.get --check-locked

      - name: Install JS dev tools
        run: pnpm --dir assets install --frozen-lockfile

      - name: Format, compile, Credo, Sobelow, Biome, tests with coverage gate
        run: mix precommit

      - name: Restore Dialyzer PLT
        id: plt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: plt-${{ steps.versions.outputs.key }}-${{ hashFiles('mix.lock') }}
          restore-keys: plt-${{ steps.versions.outputs.key }}-

      - name: Build Dialyzer PLT
        run: mix dialyzer --plt

      - name: Save Dialyzer PLT
        if: steps.plt.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: plt-${{ steps.versions.outputs.key }}-${{ hashFiles('mix.lock') }}

      - name: Dialyzer
        run: mix dialyzer --format github

  e2e:
    name: Ubuntu (E2E in Chromium)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.11.7

      - name: Read toolchain versions
        id: versions
        run: |
          otp=$(erl -noshell -eval '{ok, V} = file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])), io:put_chars(string:trim(V)), halt().')
          elixir=$(elixir -e 'IO.write(System.version())')
          echo "image=${ImageOS:?}" >> "$GITHUB_OUTPUT"
          echo "key=${ImageOS:?}-${{ runner.arch }}-otp-${otp}-elixir-${elixir}-${{ hashFiles('mise.lock') }}" >> "$GITHUB_OUTPUT"

      - name: Cache deps and _build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ github.job }}-${{ steps.versions.outputs.key }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ github.job }}-${{ steps.versions.outputs.key }}-

      - name: Install Hex and rebar3
        run: |
          mix local.hex 2.6.0 --force
          mix local.rebar --force

      - name: Fetch deps
        run: mix deps.get --check-locked

      - name: Install JS dev tools
        run: pnpm --dir assets install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.versions.outputs.image }}-${{ runner.arch }}-${{ hashFiles('assets/pnpm-lock.yaml') }}

      # Downloads Chromium only on a cache miss; always installs its system libraries.
      - name: Install Chromium
        run: pnpm --dir assets exec playwright install --with-deps chromium

      - name: Icons match the generator
        run: |
          git ls-files -z -- priv/static/images ':(exclude)priv/static/images/logo-mark.svg' ':(exclude)priv/static/images/logo.svg' | xargs -0 rm
          pnpm --dir assets run icons
          changes=$(git status --porcelain -- priv/static/images)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::priv/static/images is not what the icon generator writes"
            exit 1
          fi

      - name: Build assets
        run: |
          mix assets.setup
          mix assets.build

      - name: E2E tests
        run: mix test --only e2e --warnings-as-errors

  macos:
    name: macOS (compile, tests, prod release)
    if: github.event_name != 'schedule'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.11.7

      - name: Read toolchain versions
        id: versions
        run: |
          otp=$(erl -noshell -eval '{ok, V} = file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])), io:put_chars(string:trim(V)), halt().')
          elixir=$(elixir -e 'IO.write(System.version())')
          echo "image=${ImageOS:?}" >> "$GITHUB_OUTPUT"
          echo "key=${ImageOS:?}-${{ runner.arch }}-otp-${otp}-elixir-${elixir}-${{ hashFiles('mise.lock') }}" >> "$GITHUB_OUTPUT"

      - name: Cache deps and _build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ github.job }}-${{ steps.versions.outputs.key }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ github.job }}-${{ steps.versions.outputs.key }}-

      - name: Install Hex and rebar3
        run: |
          mix local.hex 2.6.0 --force
          mix local.rebar --force

      - name: Fetch deps
        run: mix deps.get --check-locked

      - name: Compile
        run: mix compile --warnings-as-errors
        env:
          MIX_ENV: test

      - name: Tests
        run: mix test --exclude e2e --warnings-as-errors

      - name: Prod release refuses to build without digested assets
        run: |
          if output=$(mix release --overwrite 2>&1); then
            echo "$output"
            echo "::error::mix release built a release without digested assets"
            exit 1
          fi
          echo "$output"
          if ! grep -qF "priv/static/cache_manifest.json is missing" <<< "$output"; then
            echo "::error::mix release failed, but not because the digested assets are missing"
            exit 1
          fi
        env:
          MIX_ENV: prod

      - name: Prod assets
        run: |
          mix assets.setup
          mix assets.deploy
        env:
          MIX_ENV: prod

      - name: Prod release
        run: mix release --overwrite
        env:
          MIX_ENV: prod

      - name: Config check answers in prod without the app's own config
        run: |
          unset LANTERNHALL_CONFIG DATABASE_PATH SECRET_KEY_BASE
          mix lanternhall.config.check config/install/personal.example.exs
          mix lanternhall.config.check config/install/work.example.exs
          bad="$RUNNER_TEMP/bad-install.exs"
          printf 'import Config\nconfig :lanternhall, :install, kind: :home\n' > "$bad"
          if output=$(mix lanternhall.config.check "$bad" 2>&1); then
            echo "$output"
            echo "::error::mix lanternhall.config.check passed a config with an invalid kind"
            exit 1
          fi
          echo "$output"
          if ! grep -qF "lanternhall config: :kind must be :personal or :work, got :home" <<< "$output"; then
            echo "::error::mix lanternhall.config.check failed, but not by naming the invalid key"
            exit 1
          fi
        env:
          MIX_ENV: prod
